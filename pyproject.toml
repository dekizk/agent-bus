[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "logplane"
dynamic = ["version"]
description = "A local control plane for AI agents, built on an append-only event log"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "deki"}]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.8,<3",
    "uvicorn>=0.30,<1",
]

[project.scripts]
logplane = "logplane.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["logplane*"]

[tool.setuptools.dynamic]
version = {attr = "logplane.version.VERSION"}

[tool.pytest.ini_options]
pythonpath = ["src", "."]
