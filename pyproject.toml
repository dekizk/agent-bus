[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "logplane"
dynamic = ["version"]
description = "A local control plane for AI agents, built on an append-only event log"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "deki"}]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.8,<3",
    "uvicorn>=0.30,<1",
]

keywords = ["ai-agents", "orchestration", "control-plane", "event-sourcing", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

[project.urls]
Homepage = "https://github.com/dekizk/logplane"
Documentation = "https://github.com/dekizk/logplane#documentation"
Changelog = "https://github.com/dekizk/logplane/blob/main/RELEASE_NOTES.md"
Issues = "https://github.com/dekizk/logplane/issues"

[project.scripts]
logplane = "logplane.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["logplane*"]

[tool.setuptools.dynamic]
version = {attr = "logplane.version.VERSION"}

[tool.pytest.ini_options]
pythonpath = ["src", "."]
